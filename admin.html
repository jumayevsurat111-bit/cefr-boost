<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel — CEFR Boost</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',Arial,sans-serif;background:#f8f9fc;margin:0;padding:24px;color:#1a1d29}
.box{max-width:640px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 5px 20px #0000000c}
h2{margin:0 0 6px}
h3{margin:0 0 10px;font-size:17px}
.sec{border-top:1px solid #eef0f4;margin-top:24px;padding-top:20px}
input,textarea,select{width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;border:1px solid #ddd;border-radius:6px;font:inherit}
button{padding:10px 16px;background:#4338ca;color:#fff;border:none;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:#eef0f4;color:#374151}
button.small{padding:5px 10px;font-size:12px}
button.danger{background:#fee2e2;color:#b91c1c}
.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.row input{width:110px;margin-bottom:0}
.msg{margin-top:10px;font-size:14px}
.note{color:#6b7280;font-size:13px;margin:0 0 12px}
#newCodes{font-family:monospace;font-size:15px;letter-spacing:1px;min-height:90px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eef0f4}
td.code{font-family:monospace;font-weight:700;letter-spacing:1px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
.tag.free{background:#e6f8ef;color:#0b9565}
.tag.used{background:#eef0ff;color:#5b2bc8}
.stats{font-size:14px;color:#374151;margin:12px 0 4px}
</style>
</head>
<body>
<div class="box" id="checkBox"><p>Tekshirilmoqda...</p></div>

<script>
const supabaseClient = supabase.createClient(
  "https://sgvfmqxwhypjoxcaxanh.supabase.co",
  "sb_publishable_RJM4SqD7iTiUX4wJLLMOTA_g5peTZAx"
);
const ADMIN_EMAIL = "jumayevsurat111@gmail.com";
const $ = (id) => document.getElementById(id);

// ---------- Kirish kodlari ----------
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 0/O va 1/I yo'q — adashmaslik uchun
function makeCode() {
  const a = new Uint8Array(8);
  crypto.getRandomValues(a);
  return Array.from(a, (x) => ALPHABET[x % ALPHABET.length]).join("");
}

let allCodes = [];

async function generateCodes() {
  const n = Math.max(1, Math.min(200, parseInt($("codeCount").value, 10) || 0));
  const msg = $("codeMsg");
  msg.textContent = "Yaratilmoqda...";
  const rows = Array.from({ length: n }, () => ({ code: makeCode() }));
  const { data, error } = await supabaseClient.from("access_codes").insert(rows).select("code");
  if (error) { msg.textContent = "Xato: " + error.message; return; }
  $("newCodes").value = data.map((r) => r.code).join("\n");
  msg.textContent = "✅ " + data.length + " ta yangi kod yaratildi. Pastdagi ro'yxatdan nusxalang.";
  loadCodes();
}

async function copyText(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    $("codeMsg").textContent = okMsg;
  } catch (e) {
    $("codeMsg").textContent = "Nusxalab bo'lmadi. Matnni belgilab Ctrl+C qiling.";
  }
}

async function loadCodes() {
  const { data, error } = await supabaseClient
    .from("access_codes")
    .select("id, code, used_by, used_at, created_at")
    .not("code", "like", "%#%")
    .order("created_at", { ascending: false })
    .limit(1000);
  if (error) { $("codeStats").textContent = "Xato: " + error.message; return; }
  allCodes = data || [];
  renderCodes();
}

function renderCodes() {
  const free = allCodes.filter((c) => !c.used_by).length;
  $("codeStats").textContent = "Jami: " + allCodes.length + " · Bo'sh: " + free + " · Ishlatilgan: " + (allCodes.length - free);
  const f = $("codeFilter").value;
  const list = allCodes.filter((c) => f === "all" || (f === "free" ? !c.used_by : !!c.used_by));
  const tbody = $("codeRows");
  tbody.innerHTML = "";
  if (!list.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.textContent = "Kodlar yo'q.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  list.forEach((c) => {
    const tr = document.createElement("tr");
    const tdCode = document.createElement("td");
    tdCode.className = "code";
    tdCode.textContent = c.code;
    const tdState = document.createElement("td");
    const tag = document.createElement("span");
    tag.className = "tag " + (c.used_by ? "used" : "free");
    tag.textContent = c.used_by ? "Ishlatilgan" : "Bo'sh";
    tdState.appendChild(tag);
    const tdDate = document.createElement("td");
    tdDate.textContent = new Date(c.used_at || c.created_at).toLocaleDateString("uz-UZ");
    const tdAct = document.createElement("td");
    if (!c.used_by) {
      const del = document.createElement("button");
      del.className = "small danger";
      del.textContent = "O'chirish";
      del.addEventListener("click", () => deleteCode(c.id, c.code));
      tdAct.appendChild(del);
    }
    tr.append(tdCode, tdState, tdDate, tdAct);
    tbody.appendChild(tr);
  });
}

async function deleteCode(id, code) {
  if (!confirm(code + " kodini o'chirasizmi?")) return;
  const { error } = await supabaseClient.from("access_codes").delete().eq("id", id).is("used_by", null);
  $("codeMsg").textContent = error ? "Xato: " + error.message : "Kod o'chirildi.";
  loadCodes();
}

// ---------- Umumiy kod ----------
function cell(tr, text) { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); return td; }
function actBtn(label, cls, fn) {
  const b = document.createElement("button");
  b.className = "small " + cls;
  b.style.marginRight = "4px";
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

async function loadShared() {
  const { data, error } = await supabaseClient.from("shared_codes").select("*").order("created_at", { ascending: false });
  const tbody = $("sharedRows");
  tbody.innerHTML = "";
  if (error) { $("sharedMsg").textContent = "Xato: " + error.message; return; }
  if (!data.length) {
    const tr = document.createElement("tr");
    const td = cell(tr, "Umumiy kod yo'q.");
    td.colSpan = 4;
    tbody.appendChild(tr);
    return;
  }
  for (const sc of data) {
    const { count } = await supabaseClient.from("access_codes")
      .select("id", { count: "exact", head: true }).like("code", sc.code + "#%");
    const tr = document.createElement("tr");
    cell(tr, sc.code).className = "code";
    cell(tr, (count || 0) + (sc.max_uses ? " / " + sc.max_uses : ""));
    const tdState = document.createElement("td");
    const tag = document.createElement("span");
    tag.className = "tag " + (sc.is_active ? "free" : "used");
    tag.textContent = sc.is_active ? "Faol" : "Yopiq";
    tdState.appendChild(tag);
    tr.appendChild(tdState);
    const tdAct = document.createElement("td");
    tdAct.appendChild(actBtn(sc.is_active ? "Yopish" : "Ochish", "ghost", () => toggleShared(sc)));
    tdAct.appendChild(actBtn("Ruxsatni bekor qilish", "danger", () => revokeShared(sc)));
    tdAct.appendChild(actBtn("O'chirish", "danger", () => deleteShared(sc)));
    tr.appendChild(tdAct);
    tbody.appendChild(tr);
  }
}

async function addShared() {
  const msg = $("sharedMsg");
  let code = $("sharedCode").value.trim().toUpperCase() || makeCode();
  if (!/^[A-Z0-9]{4,20}$/.test(code)) { msg.textContent = "Kod 4-20 ta harf yoki raqamdan iborat bo'lsin."; return; }
  const max = parseInt($("sharedMax").value, 10);
  const { error } = await supabaseClient.from("shared_codes").insert({ code, max_uses: max > 0 ? max : null });
  if (error) { msg.textContent = error.message.includes("duplicate") ? "Bu kod allaqachon bor." : "Xato: " + error.message; return; }
  msg.textContent = "✅ Umumiy kod yaratildi: " + code;
  $("sharedCode").value = "";
  $("sharedMax").value = "";
  loadShared();
}

async function toggleShared(sc) {
  const { error } = await supabaseClient.from("shared_codes").update({ is_active: !sc.is_active }).eq("id", sc.id);
  $("sharedMsg").textContent = error ? "Xato: " + error.message : (sc.is_active ? "Kod yopildi: yangi odamlar kira olmaydi." : "Kod qayta ochildi.");
  loadShared();
}

async function revokeShared(sc) {
  if (!confirm(sc.code + " kodi bilan kirgan HAMMA odamning ruxsati bekor qilinadi. Davom etasizmi?")) return;
  const { error } = await supabaseClient.from("access_codes").delete().like("code", sc.code + "#%");
  $("sharedMsg").textContent = error ? "Xato: " + error.message : "Ruxsatlar bekor qilindi (bir necha daqiqada kuchga kiradi).";
  loadShared();
}

async function deleteShared(sc) {
  if (!confirm(sc.code + " kodini o'chirasizmi? Kirganlarning ruxsati saqlanadi.")) return;
  const { error } = await supabaseClient.from("shared_codes").delete().eq("id", sc.id);
  $("sharedMsg").textContent = error ? "Xato: " + error.message : "Kod o'chirildi.";
  loadShared();
}

// ---------- Statistika ----------
async function loadStats() {
  $("statsTotal").textContent = "Yangilanmoqda...";
  const { data, error } = await supabaseClient.from("Results")
    .select("mock_name, user_id, certificate_score").limit(5000);
  const tbody = $("statsRows");
  tbody.innerHTML = "";
  if (error) { $("statsTotal").textContent = "Xato: " + error.message; return; }
  const rows = data || [];
  const allUsers = new Set(rows.map((r) => r.user_id));
  $("statsTotal").textContent = "Jami urinishlar: " + rows.length + " · Test yechgan o'quvchilar: " + allUsers.size + " · yangilandi: " + new Date().toLocaleTimeString("uz-UZ");
  const by = {};
  rows.forEach((r) => {
    const m = by[r.mock_name] || (by[r.mock_name] = { n: 0, users: new Set(), sum: 0 });
    m.n++; m.users.add(r.user_id); m.sum += Number(r.certificate_score) || 0;
  });
  const names = Object.keys(by).sort();
  if (!names.length) {
    const tr = document.createElement("tr");
    const td = cell(tr, "Hali natija yo'q.");
    td.colSpan = 4;
    tbody.appendChild(tr);
    return;
  }
  names.forEach((name) => {
    const m = by[name];
    const tr = document.createElement("tr");
    cell(tr, name);
    cell(tr, String(m.n));
    cell(tr, String(m.users.size));
    cell(tr, Math.round(m.sum / m.n) + "/75");
    tbody.appendChild(tr);
  });
}

// ---------- Sahifa ----------
(async () => {
  const { data } = await supabaseClient.auth.getSession();
  const box = $("checkBox");
  if (!data.session || data.session.user.email !== ADMIN_EMAIL) {
    box.innerHTML = "<h2>Kirish taqiqlangan</h2><p>Bu sahifa faqat admin uchun.</p>";
    return;
  }
  box.innerHTML = `
  <h2>Admin Panel</h2>

  <div class="sec" style="border-top:0;margin-top:12px;padding-top:0">
    <h3>🔑 Kirish kodlari</h3>
    <p class="note">Har bir kod bitta o'quvchi uchun va bir marta ishlaydi.</p>
    <div class="row">
      <input id="codeCount" type="number" min="1" max="200" value="10" aria-label="Nechta kod">
      <button id="genCodesBtn">Kodlarni yaratish</button>
    </div>
    <textarea id="newCodes" readonly placeholder="Yangi kodlar shu yerda chiqadi"></textarea>
    <div class="row">
      <button class="ghost" id="copyNewBtn">Yangilarini nusxalash</button>
      <button class="ghost" id="copyFreeBtn">Barcha bo'sh kodlarni nusxalash</button>
    </div>
    <div class="msg" id="codeMsg"></div>
    <div class="stats" id="codeStats">Yuklanmoqda...</div>
    <select id="codeFilter" aria-label="Filtr" style="width:auto;margin:6px 0 0">
      <option value="all">Hammasi</option>
      <option value="free">Faqat bo'sh</option>
      <option value="used">Faqat ishlatilgan</option>
    </select>
    <table>
      <thead><tr><th>Kod</th><th>Holati</th><th>Sana</th><th></th></tr></thead>
      <tbody id="codeRows"></tbody>
    </table>
  </div>

  <div class="sec">
    <h3>👥 Umumiy kod (hamma uchun bitta)</h3>
    <p class="note">Kanalga bitta kod joylaysiz. Kodni yopsangiz, yangi odamlar kira olmaydi. Oldin kirganlar kirishda davom etadi, xohlasangiz ularning ruxsatini ham bekor qilasiz.</p>
    <div class="row">
      <input id="sharedCode" placeholder="Kod (harf/raqam)" maxlength="20" style="width:170px;text-transform:uppercase">
      <input id="sharedMax" type="number" min="1" placeholder="Limit (ixtiyoriy)" style="width:150px">
      <button id="addSharedBtn">Umumiy kod yaratish</button>
    </div>
    <div class="msg" id="sharedMsg"></div>
    <table>
      <thead><tr><th>Kod</th><th>Kirganlar</th><th>Holati</th><th></th></tr></thead>
      <tbody id="sharedRows"></tbody>
    </table>
  </div>

  <div class="sec">
    <h3>📊 Statistika</h3>
    <div class="stats" id="statsTotal">Yuklanmoqda...</div>
    <table>
      <thead><tr><th>Mock</th><th>Urinishlar</th><th>O'quvchilar</th><th>O'rtacha ball</th></tr></thead>
      <tbody id="statsRows"></tbody>
    </table>
    <button class="ghost small" id="statsRefresh" style="margin-top:10px">Yangilash</button>
  </div>

  <div class="sec">
    <h3>Yangi Writing mock qo'shish</h3>
    <input id="m_title" placeholder="Test nomi (masalan: Writing Mock 02)">
    <input id="m_t11_title" placeholder="Task 1.1 sarlavhasi">
    <textarea id="m_t11_prompt" placeholder="Task 1.1 savoli" rows="3"></textarea>
    <input id="m_t11_length" placeholder="Task 1.1 uzunlik (masalan: 45-55 words)">
    <input id="m_t12_title" placeholder="Task 1.2 sarlavhasi">
    <textarea id="m_t12_prompt" placeholder="Task 1.2 savoli" rows="3"></textarea>
    <input id="m_t12_length" placeholder="Task 1.2 uzunlik">
    <input id="m_t2_title" placeholder="Task 2 sarlavhasi">
    <textarea id="m_t2_prompt" placeholder="Task 2 savoli" rows="3"></textarea>
    <input id="m_t2_length" placeholder="Task 2 uzunlik">
    <button id="saveMockBtn">Saqlash</button>
    <div class="msg" id="saveMsg"></div>
  </div>

  <div class="sec">
    <h3>Speaking mock qo'shish</h3>
    <input type="text" id="spTitle" placeholder="Mock nomi (masalan: Speaking Mock 01)">
    <input type="text" id="spQ1" placeholder="Part 1.1 - 1-savol">
    <input type="text" id="spQ2" placeholder="Part 1.1 - 2-savol">
    <input type="text" id="spQ3" placeholder="Part 1.1 - 3-savol">
    <button id="addSpeakingMockBtn">Speaking mock qo'shish</button>
    <div class="msg" id="spStatus"></div>
  </div>
  `;

  // kodlar
  $("genCodesBtn").addEventListener("click", generateCodes);
  $("codeFilter").addEventListener("change", renderCodes);
  $("copyNewBtn").addEventListener("click", () => {
    const t = $("newCodes").value.trim();
    if (!t) { $("codeMsg").textContent = "Avval kodlarni yarating."; return; }
    copyText(t, "✅ Yangi kodlar nusxalandi.");
  });
  $("copyFreeBtn").addEventListener("click", () => {
    const t = allCodes.filter((c) => !c.used_by).map((c) => c.code).join("\n");
    if (!t) { $("codeMsg").textContent = "Bo'sh kod yo'q."; return; }
    copyText(t, "✅ Barcha bo'sh kodlar nusxalandi.");
  });
  loadCodes();
  $("addSharedBtn").addEventListener("click", addShared);
  loadShared();
  $("statsRefresh").addEventListener("click", loadStats);
  loadStats();

  // Writing mock
  $("saveMockBtn").addEventListener("click", async () => {
    const { error } = await supabaseClient.from("mocks").insert({
      title: $("m_title").value,
      task11_title: $("m_t11_title").value,
      task11_prompt: $("m_t11_prompt").value,
      task11_length: $("m_t11_length").value,
      task12_title: $("m_t12_title").value,
      task12_prompt: $("m_t12_prompt").value,
      task12_length: $("m_t12_length").value,
      task2_title: $("m_t2_title").value,
      task2_prompt: $("m_t2_prompt").value,
      task2_length: $("m_t2_length").value,
      is_active: true
    });
    $("saveMsg").textContent = error ? "Xato: " + error.message : "✅ Saqlandi!";
  });

  // Speaking mock
  $("addSpeakingMockBtn").addEventListener("click", async () => {
    const title = $("spTitle").value.trim();
    const q1 = $("spQ1").value.trim();
    const q2 = $("spQ2").value.trim();
    const q3 = $("spQ3").value.trim();
    const statusEl = $("spStatus");
    if (!title || !q1 || !q2 || !q3) {
      statusEl.textContent = "Barcha maydonlarni to'ldiring.";
      return;
    }
    const { error } = await supabaseClient.from("speaking_mocks").insert({
      title, part11_q1: q1, part11_q2: q2, part11_q3: q3
    });
    statusEl.textContent = error ? "Xatolik: " + error.message : "Qo'shildi ✅";
    if (!error) {
      ["spTitle", "spQ1", "spQ2", "spQ3"].forEach((id) => { $(id).value = ""; });
    }
  });
})();
</script>
</body>
</html>
